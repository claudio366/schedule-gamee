<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a12"><title>Schedule</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef2f7;--mu:#9aa7bd;--ok:#4fe3a0;--line:rgba(255,255,255,.12);--k:#4fe3a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(110% 60% at 50% 0,#1d2f52 0,#0b1020 60%,#070a12 100%) fixed #070a12;color:var(--ink);font:500 15px/1.35 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:480px;margin:0 auto}
/* fondo vivo */
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1;animation:orb 20s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#3b6bff;top:-90px;left:-90px;opacity:.38}
.o2{width:260px;height:260px;background:#a046ff;bottom:-70px;right:-90px;opacity:.32;animation-delay:-7s}
.o3{width:200px;height:200px;background:#17d6a0;top:48%;left:62%;opacity:.16;animation-delay:-13s}
@keyframes orb{to{transform:translate(50px,70px) scale(1.18)}}
/* cabecera */
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:26px;margin:4px 0 0;letter-spacing:5px;font-weight:800;background:linear-gradient(90deg,#fff 10%,#9db8ff 55%,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(130,160,255,.35))}
.sub{letter-spacing:2px;text-transform:uppercase;font-size:11px;font-weight:700;color:var(--mu)}
.ib{display:flex;gap:8px}.ib button{width:42px;height:42px;padding:0;font-size:18px;border-radius:50%}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:14px;margin:12px 0;box-shadow:0 12px 36px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top{display:flex;gap:10px}.top .card{flex:1;margin:12px 0 6px;padding:10px 14px}.top b{display:block;font-size:24px;font-weight:800;transform-origin:left center}
.bp{animation:bp .38s ease-out}@keyframes bp{40%{transform:scale(1.18);color:#ffd45e}}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills:empty{display:none}.pills span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);animation:pin .3s ease-out}
.pills .bad{background:rgba(255,90,70,.16);border-color:rgba(255,120,100,.4);color:#ffb4a8}.pills .good{background:rgba(79,227,160,.16);border-color:rgba(79,227,160,.4);color:#9bf5cb}
@keyframes pin{from{transform:scale(.85);opacity:0}}
/* botones */
button{font:inherit;font-weight:700;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:transform .1s,filter .2s,opacity .2s;position:relative;overflow:hidden}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .5s}
button:not(:disabled):active::after{transform:translateX(120%);transition:0s}
button:active{transform:scale(.93)}button:disabled{opacity:.4;cursor:not-allowed}
.g{background:linear-gradient(#3fe39a,#1a9b62);border-color:rgba(120,255,190,.4);box-shadow:0 6px 20px -4px rgba(40,210,140,.55)}
.y{background:linear-gradient(#ffd45e,#f2a60f);color:#3a2300;border-color:rgba(255,230,140,.6);box-shadow:0 6px 20px -4px rgba(255,180,40,.5)}
.bad{background:linear-gradient(#ff7a62,#c9382a);border-color:rgba(255,150,130,.5)}
.dim{opacity:.5}
.btns{margin-top:10px}.btns button{flex:1;padding:11px 6px;font-size:14px}
.chips{display:flex;gap:8px;margin-top:8px}.chips span{font-size:12px;color:var(--mu);background:rgba(0,0,0,.25);padding:4px 10px;border-radius:999px}.chips b{color:#fff}
/* barras */
.bar{height:8px;background:rgba(0,0,0,.38);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s;position:relative;overflow:hidden;border-radius:6px}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shm 1.8s linear infinite}
@keyframes shm{to{transform:translateX(100%)}}
#ht{background:linear-gradient(90deg,#ffd45e,#ff6b3d,#ff2d55)}
.hot #ht{box-shadow:0 0 14px #ff2d55}.hot{animation:hotp 1s ease-in-out infinite alternate}@keyframes hotp{to{border-color:rgba(255,70,90,.7)}}
/* laboratorio animado (estilo GIF) */
#scn{background:radial-gradient(120% 90% at 50% 0,rgba(255,255,255,.09),rgba(0,0,0,.3));border-radius:18px;border:1px solid var(--line);padding:6px 6px 0;transition:box-shadow .6s}
#scn svg{display:block;width:100%;max-height:190px;margin:auto;opacity:.72;transition:opacity .5s}
#sc.on #scn svg{opacity:1}
#sc.proc #scn{box-shadow:0 0 42px -8px var(--k),inset 0 0 34px -12px var(--k)}
#lv{transition:transform 1s linear}
.lq{fill:var(--k)}.w{transform-box:view-box}
.bb{opacity:0;fill:rgba(255,255,255,.85);transform-box:fill-box;transform-origin:center}
.au{fill:var(--k);opacity:0;transform-box:fill-box;transform-origin:center}
.stm{fill:rgba(255,255,255,.6);opacity:0;transform-box:fill-box;transform-origin:center}
.fm{fill:#ff8a1f;opacity:0;transform-box:fill-box;transform-origin:50% 100%}.fm2{fill:#ffe27a;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.sp{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center}
.tb{fill:var(--k);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.35)}
.gr,.orbt{transform-box:view-box}
.gl{fill:var(--k)}.pipe{fill:none;stroke:var(--k);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 7;opacity:0}
#sc.on .w1{animation:sl1 2.6s linear infinite}#sc.on .w2{animation:sl2 3.8s linear infinite}
#sc.on .bb{animation:up 2.4s ease-in infinite}
#sc.proc .au{animation:aur 2.2s ease-in-out infinite}
#sc.proc .stm{animation:stm 2.4s ease-out infinite}
#sc.proc .fm,#sc.proc .fm2{opacity:1;animation:flk .45s ease-in-out infinite alternate}
#sc.proc .gr{animation:spin 6s linear infinite}#sc.proc .gr.r2{animation:spinr 4s linear infinite}
#sc.proc .orbt{animation:spin 3.2s linear infinite}
#sc.proc .tb{animation:fill 2.6s ease-in-out infinite alternate}
#sc.proc .sp{animation:tw 1.8s ease-in-out infinite}
#sc.proc .pipe{opacity:.9;animation:flow 1s linear infinite}
@keyframes sl1{to{transform:translateX(-60px)}}@keyframes sl2{from{transform:translateX(-60px)}to{transform:translateX(0)}}
@keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@keyframes aur{0%,100%{opacity:.08;transform:scale(.9)}50%{opacity:.28;transform:scale(1.1)}}
@keyframes stm{0%{transform:translate(0,6px) scale(.5);opacity:0}30%{opacity:.65}100%{transform:translate(var(--dx,6px),-34px) scale(1.9);opacity:0}}
@keyframes flk{from{transform:scale(1,1)}to{transform:scale(.88,1.18)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes fill{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes tw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1.2);opacity:1}}
@keyframes flow{to{stroke-dashoffset:-22}}
.st{font-size:13px;font-weight:700;color:var(--mu)}#sc.proc .st{color:var(--k)}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-left:3px;animation:dt 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
/* toast y efectos */
#tt{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:rgba(18,24,42,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);color:#fff;padding:10px 16px;border-radius:16px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;max-width:90%;text-align:center;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.45)}#tt.on{opacity:1;transform:translate(-50%,0)}
.rp{position:fixed;width:12px;height:12px;border-radius:50%;border:2px solid rgba(160,190,255,.9);box-shadow:0 0 14px rgba(120,160,255,.7),inset 0 0 8px rgba(120,160,255,.4);pointer-events:none;z-index:40;animation:rp .7s ease-out both}
.rp.r2{animation-delay:.09s;border-color:rgba(255,255,255,.7)}
@keyframes rp{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) scale(8);opacity:0}}
.pp{position:fixed;border-radius:50%;pointer-events:none;z-index:40;width:6px;height:6px}
.cn{background:none!important;box-shadow:none!important;font-size:17px;width:auto;height:auto}
.ft{position:fixed;font-weight:800;font-size:20px;pointer-events:none;z-index:45;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#fl{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;background:radial-gradient(circle,transparent 30%,rgba(255,40,70,.55))}
#fl.on{animation:fls .7s ease-out}@keyframes fls{from{opacity:1}to{opacity:0}}
.shk{animation:shk .5s}@keyframes shk{10%,50%,90%{transform:translateX(-7px)}30%,70%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
#tt{bottom:calc(92px + env(safe-area-inset-bottom))}
svg.ic{vertical-align:-3px;flex:none}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hd{justify-content:flex-start;gap:12px}.ttl{min-width:0}
.ib{width:44px;height:44px;padding:0;border-radius:50%;flex:none}
.ib2{width:36px;height:36px;padding:0;border-radius:50%}
.top .mu{display:flex;align-items:center;gap:6px}
.cn{width:15px!important;height:15px!important;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,#f2a60f 70%)!important;border:2px solid #fff3c4;box-shadow:0 0 10px rgba(255,200,60,.8)!important}
.card b{display:inline-flex;align-items:center;gap:6px}
.top b{display:block}
/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));display:flex;gap:6px;padding:6px;border-radius:24px;background:rgba(14,20,38,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:30}
#nav button{flex:1;flex-direction:column;gap:3px;padding:9px 4px;border-radius:18px;background:none;border:0;font-size:11px;color:var(--mu)}
#nav button.on{background:linear-gradient(160deg,rgba(108,140,255,.38),rgba(176,108,255,.26));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
/* tutorial */
.tut{border-color:rgba(130,160,255,.45);background:linear-gradient(160deg,rgba(108,140,255,.18),rgba(176,108,255,.08))}
.dots2{display:flex;gap:5px}.dots2 i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}.dots2 i.on{background:#9db8ff;box-shadow:0 0 8px #9db8ff}
/* ajustes */
#sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,6,14,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.on{opacity:1;pointer-events:auto}
.panel{width:min(480px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(170deg,#19233c,#0e1527);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheet.on .panel{transform:none}
.set{padding:13px 0;border-top:1px solid var(--line);margin-top:12px}.set:first-of-type{margin-top:8px}
.lb{display:flex;align-items:center;gap:8px;font-weight:700}
.sw{width:52px;height:30px;padding:0;border-radius:999px;background:rgba(255,255,255,.14);flex:none}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw::after{display:none}
.sw.on{background:linear-gradient(#3fe39a,#1a9b62)}.sw.on::before{transform:translateX(22px)}
input[type=range]{width:100%;accent-color:#7b9cff;margin:10px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.seg button{flex:1 1 30%}.seg button.on{background:linear-gradient(160deg,#6c8cff,#a46cff);border-color:transparent}
/* ruleta */
.wheelw{position:relative;width:min(330px,88%);margin:6px auto 4px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.wheelw svg{display:block;width:100%}
#wrot{transform-box:view-box}
.led{fill:#fff;animation:led 1s ease-in-out infinite alternate}.led:nth-child(even){animation-delay:.5s}
@keyframes led{from{opacity:.35}to{opacity:1}}
.spinning .led{animation-duration:.25s}
.prize{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.25);margin-top:10px}
/* airdrop */
.big{font-size:34px;font-weight:800;background:linear-gradient(90deg,#ffe27a,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.days{display:flex;gap:6px;margin:10px 0}.days div{flex:1;aspect-ratio:1;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mu)}
.days div.on{background:linear-gradient(160deg,#3fe39a,#1a9b62);color:#fff;border-color:transparent;box-shadow:0 4px 14px -4px rgba(40,210,140,.6)}.days div.gf{border-color:rgba(255,212,94,.6);color:#ffd45e}
.tr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.tr:first-of-type{border-top:0}
.ti{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none;color:#9db8ff}
.tx{flex:1;min-width:0}.tx b{display:block}.tx .mu{display:block;font-size:12px}
.tr button{padding:8px 13px;font-size:13px;flex:none}
.dn{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700;font-size:13px;flex:none}
.lnk{font-size:12px;word-break:break-all;background:rgba(0,0,0,.28);padding:8px 10px;border-radius:12px;margin-top:8px;color:#bcd0ff}
/* anuncio */
#adv{position:fixed;inset:0;z-index:90;background:rgba(3,6,14,.94);display:none;align-items:center;justify-content:center;padding:24px}#adv.on{display:flex}
.abox{width:min(340px,100%);text-align:center;background:linear-gradient(170deg,#1a2442,#0e1527);border:1px solid var(--line);border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative}
.abdg{position:absolute;top:12px;right:14px;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.12);color:var(--mu)}
.aico{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#6c8cff,#a46cff);box-shadow:0 0 30px rgba(130,150,255,.5)}
.aprog{width:100%;height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}.aprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6c8cff,#a46cff);transition:width 1s linear}
.pills .good,.pills .bad{display:inline-flex;align-items:center;gap:5px}
.qs{margin-top:10px}.qc{display:flex;align-items:center;gap:6px;margin-top:6px}.qc button{flex:1;padding:8px 4px;font-size:13px}.qc b{flex:1.4;justify-content:center;font-size:15px}
</style></head><body>

<div id="app">

function tgT(){s.tu=s.tu?0:1;if(s.tu)s.ts=0;rSet();draw()}

/* ===== Vistas ===== */
function applyLang(){document.documentElement.lang=L();document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.getAttribute("data-i"))});rN();buildWheel();pk="";draw()}
function applyIcons(){document.querySelectorAll("[data-ic]").forEach(function(e){e.innerHTML=I(e.getAttribute("data-ic"),+e.getAttribute("data-sz")||18)})}
function rN(){var a=[["flask","n_game"],["wheel","n_wheel"],["gift","n_air"]],h="";a.forEach(function(x,i){h+="<button class='"+(cv==i+1?"on":"")+"' onclick='go("+(i+1)+")'>"+I(x[0],22)+"<span>"+t(x[1])+"</span></button>"});$("nav").innerHTML=h}
function go(n){cv=n;if(n==3)srvSync();["v1","v2","v3"].forEach(function(id,i){$(id).hidden=(i+1!==n)});rN();window.scrollTo(0,0)}
function rT(){var e=$("tu");if(!s.tu){e.innerHTML="";return}var i=Math.min(s.ts,4),d="";for(var k=0;k<5;k++)d+="<i class='"+(k<=i?"on":"")+"'></i>";
 e.innerHTML="<div class='card tut'><div class='row'><b>"+I("book",18)+" "+t("tu_"+(i+1)+"_t")+"</b><span class='mu'>"+t("tu_step",i+1,5)+"</span></div><div style='margin:6px 0 12px;color:#cdd7e8;font-size:14px'>"+t("tu_"+(i+1))+"</div><div class='row'><div class='dots2'>"+d+"</div><div class='row' style='gap:6px'><button onclick='tuSkip()'>"+t("tu_skip")+"</button><button class='g' onclick='tuNext()'>"+(i==4?t("tu_done"):t("tu_next"))+"</button></div></div></div>"}
function tuNext(){if(s.ts>=4)s.tu=0;else s.ts++;draw()}
function tuSkip(){s.tu=0;draw()}
function rB(){var n=Date.now(),b="";
 if(s.bo>n)b="<span class='st' id='bon' style='color:#ffd45e'></span>";
 else if(s.bc>n)b="<button disabled id='bcd' style='width:100%'></button>";
 else b="<button class='y' style='width:100%' onclick='boost()'>"+I("play",18)+" "+t("boost_btn")+"</button>";
 $("bst").innerHTML="<div class='card'><div class='row'><b>"+I("zap",18,"color:#ffd45e")+" "+t("boost_t")+"</b>"+(s.bo>n?b:"")+"</div><div class='mu' style='margin:4px 0 "+(s.bo>n?0:10)+"px'>"+t("boost_d")+"</div>"+(s.bo>n?"":b)+"</div>"}
function rW(){var n=Date.now(),fr=n>=s.sp,lf=Math.max(0,5-s.dt.sa);
 $("rt").innerHTML=I("wheel",22,"color:#ffd45e")+" "+t("r_title");$("rs").textContent=t("r_sub");
 $("rb").innerHTML="<div class='row btns' style='flex-direction:column;align-items:stretch'>"+(fr?"<button class='g' onclick='spin(0)'>"+I("wheel",18)+" "+t("r_free")+"</button>":"<button disabled id='rwc'></button>")+
 "<button class='y' "+(lf?"":"disabled")+" onclick='spin(1)'>"+I("play",18)+" "+(lf?t("r_ad",lf):t("r_noad"))+"</button></div>"+
 (s.lp?"<div class='prize'>"+I("gift",20,"color:#ffd45e")+"<div><div class='mu'>"+t("r_last")+"</div><b>"+s.lp.m+"</b></div></div>":"")+"<div class='mu' style='margin-top:10px;text-align:center'>"+t("r_hint")+"</div>"}
function fillN(){if(SRV&&s.fl!=null)return s.fl;var ys=ds(new Date(Date.now()-864e5));return s.lc==s.dk?((s.sk-1)%7)+1:(s.lc==ys?s.sk%7:0)}
function tr(ic,ti,sub,right){return "<div class='tr'><div class='ti'>"+I(ic,20)+"</div><div class='tx'><b>"+ti+"</b><span class='mu'>"+sub+"</span></div>"+right+"</div>"}
function dnT(){return "<span class='dn'>"+I("check",16)+" "+t("a_done")+"</span>"}
function clB(id,en){return "<button class='g"+(en?"":" dim")+"' onclick='claim(\""+id+"\")'>"+t("a_claim")+"</button>"}
function rA(){var d=s.dt,fl=fillN(),dn=!!d.ci,days="",h;
 for(var k=1;k<=7;k++)days+="<div class='"+(k<=fl?"on":(k==7?"gf":""))+"'>"+(k==7?I("gift",16):k)+"</div>";
 h="<div class='card'><div class='mu'>"+t("a_sub")+"</div><div class='mu' style='margin-top:10px'>"+t("a_pts")+"</div><span class='big'>"+fmt(s.pt)+"</span></div>";
 h+="<div class='card'><b>"+I("cal",18,"color:#9db8ff")+" "+t("a_streak")+"</b><div class='days'>"+days+"</div>"+(dn?"<button disabled style='width:100%'>"+t("a_back")+"</button>":"<button class='g' style='width:100%' onclick='checkin()'>"+t("a_cin",fl+1)+"</button>")+"</div>";
 h+="<div class='card'><b>"+t("a_daily")+"</b><div style='margin-top:6px'>"+
  tr("play",t("t_ad",d.ad),t("rw_pts",20),d.ad>=3?dnT():"<button class='y' onclick='adTask()'>"+t("go")+"</button>")+
  tr("coins",t("t_sold"),fmt(Math.min(d.sold,400))+" / 400 · "+t("rw_both",fmt(rent()),25),d.c.sold?dnT():clB("sold",d.sold>=400))+
  tr("wheel",t("t_spin"),t("rw_pts",15),d.c.sp?dnT():clB("sp",d.sp>=1))+
  tr("flask",t("t_proc"),Math.min(d.pr,3)+" / 3 · "+t("rw_pts",20),d.c.pr?dnT():clB("pr",d.pr>=3))+"</div></div>";
 var once="";
 [["ch","CHANNEL","send","t_ch"],["x","X","link","t_x"]].forEach(function(o){if(!CFG[o[1]])return;var rd=s.rdy[o[0]];once+=tr(o[2],t(o[3]),t("rw_pts",100),s.dn[o[0]]?dnT():(rd?"<button class='g"+(Date.now()>=rd?"":" dim")+"' onclick='claimOnce(\""+o[0]+"\")'>"+t("a_claim")+"</button>":"<button class='y' onclick='openTask(\""+o[0]+"\",\""+o[1]+"\")'>"+t("go")+"</button>"))});
 if(once)h+="<div class='card'><b>"+t("a_once")+"</b><div style='margin-top:6px'>"+once+"</div></div>";
 var ms=[[1,100],[3,400],[10,1500]],ml="";
 ms.forEach(function(m){var id="i"+m[0];ml+=tr("users",t("a_m",m[0]),t("rw_pts",fmt(m[1])),s.dn[id]?dnT():clB(id,s.inv>=m[0]))});
 var lk=refLink();
 h+="<div class='card'><div class='row'><b>"+I("users",18,"color:#9db8ff")+" "+t("a_inv")+"</b><span class='mu'>"+t("a_invited",s.inv)+"</span></div><div class='mu' style='margin-top:4px'>"+t("a_inv_d")+"</div>"+
  (lk?"<div class='lnk'>"+lk+"</div>":"<div class='lnk' style='color:var(--mu)'>"+t("a_nolink")+"</div>")+
  "<div class='row btns'><button class='g' onclick='shareL()'>"+I("send",16)+" "+t("a_share")+"</button><button onclick='copyL()'>"+I("copy",16)+" "+t("a_copy")+"</button></div><div style='margin-top:8px'>"+ml+"</div></div>";
 h+="<div class='card'><b>"+t("a_redt")+"</b><div class='mu'>"+t("a_note")+"</div><button disabled style='margin-top:8px;width:100%'>"+t("a_red")+"</button></div>";
 $("aw").innerHTML=h}
/* Airdrop: acciones */
function checkin(){if(SRV)return S("checkin");chk();if(s.dt.ci)return;var d=fillN()+1,ys=ds(new Date(Date.now()-864e5));s.sk=(s.lc==ys)?s.sk+1:1;s.lc=s.dk;s.dt.ci=1;if(d==7)s.sp=0;give(Math.round(rent()*(.5+.25*d)),10*d+(d==7?40:0))}
function adTask(){chk();if(s.dt.ad>=3)return;showAd(function(ok){if(!ok)return toast(t("ad_none"));if(SRV)return S("adtask",null,null,3);chk();s.dt.ad++;give(0,20)})}
function claim(id){if(SRV)return S("claim",{id:id});chk();var d=s.dt;
 if(id=="sold"){if(d.c.sold||d.sold<400)return err(t("wait"));d.c.sold=1;give(rent(),25)}
 else if(id=="sp"){if(d.c.sp||d.sp<1)return err(t("wait"));d.c.sp=1;give(0,15)}
 else if(id=="pr"){if(d.c.pr||d.pr<3)return err(t("wait"));d.c.pr=1;give(0,20)}
 else{if(CFG.BACKEND&&TG&&TG.initData){return api("/api/claim",{id:id},function(r){if(r&&r.ok){s.dn[id]=1;give(0,r.pts)}else if(r)err(t("wait"));else err(t("srv_err"))})}var n=+id.slice(1),r={1:100,3:400,10:1500}[n];if(s.dn[id]||s.inv<n)return err(t("wait"));s.dn[id]=1;give(0,r)}}
function openL(u){try{if(TG&&/^https:\/\/t\.me\//.test(u)&&TG.openTelegramLink)TG.openTelegramLink(u);else if(TG&&TG.openLink)TG.openLink(u);else window.open(u,"_blank")}catch(e){window.open(u,"_blank")}}
function openTask(id,key){openL(CFG[key]);s.rdy[id]=Date.now()+6000;setTimeout(draw,6100);draw()}
function claimOnce(id){var r=s.rdy[id];if(!r||s.dn[id])return;if(Date.now()<r)return err(t("wait"));if(SRV)return S("claim",{id:id});s.dn[id]=1;give(0,100)}
function uid(){var u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u&&u.id)return String(u.id);if(!s.uid)s.uid=String(Math.floor(Math.random()*9e8+1e8));return s.uid}
function refLink(){return CFG.BOT?"https://t.me/"+CFG.BOT+(CFG.APP?"/"+CFG.APP:"")+"?startapp=ref_"+uid():""}
function shareL(){var l=refLink();if(!l)return err(t("a_nolink"));openL("https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent(t("a_text")))}
function copyL(){var l=refLink();if(!l)return err(t("a_nolink"));var ok=function(){toast(t("a_copied"));sfx("pop")};
 try{navigator.clipboard.writeText(l).then(ok,function(){fb()})}catch(e){fb()}
 function fb(){try{var a=document.createElement("textarea");a.value=l;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}catch(e){}}}

/* ===== Pintado principal ===== */
function jobs(){var n=Date.now(),pr=s.jb.filter(function(j){return j.st==2}),h="",sc=$("sc");$("sl").textContent=t("slots",s.jb.length,s.sl);
 sc.classList.toggle("on",s.jb.length>0);sc.classList.toggle("proc",pr.length>0);
 var ld=pr[0]||s.jb[0];
 if(ld){var q=P[ld.p],tt=(ld.st==1?q.t1:q.t2)*1000,w=Math.max(0,Math.min(1,1-(ld.end-n)/tt));sc.style.setProperty("--k",q.k);$("lv").style.transform="translateY("+(94-38*w).toFixed(1)+"px)"}else $("lv").style.transform="translateY(96px)";
 $("sct").innerHTML=pr.length?t("st_proc",pr.length)+"<span class='dots'><i></i><i></i><i></i></span>":(s.jb.length?t("st_make"):t("st_idle"));
 s.jb.forEach(function(j){var q=P[j.p],tot=(j.st==1?q.t1:q.t2)*1000,w=Math.max(0,Math.min(100,(1-(j.end-n)/tot)*100));h+="<div class='mu' style='margin-top:8px'>"+I("gem",14,"color:"+q.k)+" "+q.n+" · "+(j.st==1?t("j_make"):t("j_proc"))+" · "+ft((j.end-n)/1000)+"<div class='bar'><i style='width:"+w+"%;background:"+q.k+"'></i></div></div>"});$("jb").innerHTML=h}
function hud(){var n=Date.now(),b="";$("ht").style.width=s.ht+"%";$("hc").classList.toggle("hot",s.ht>70);$("rk").textContent=t("risk",Math.round(risk()*100));$("rn").innerHTML=I("home",14)+" "+t("rentin",fmt(rent()),ft((s.rn-n)/1000));
 P.forEach(function(q,p){var e=$("pr"+p);if(e)e.textContent=t("worth",fmt(price(p)))+(vipm(p)>1?" ★":(s.mp[p]<.95?" ↓":""))});
 if(s.cx>n)b+="<span class='bad'>"+I("box",14)+t("pl_cost",ft((s.cx-n)/1000))+"</span>";
 if(s.vu>n&&s.vp>=0)b+="<span class='good'>"+I("crown",14)+t("pl_vip",P[s.vp].n,ft((s.vu-n)/1000))+"</span>";
 if(s.sh)b+="<span class='good'>"+I("shield",14)+t("pl_sh")+"</span>";
 if(s.bo>n)b+="<span class='good'>"+I("zap",14)+t("boost_on",ft((s.bo-n)/1000))+"</span>";
 $("ev").innerHTML=b;
 var e1=$("bon");if(e1)e1.textContent=t("boost_on",ft((s.bo-n)/1000));var e2=$("bcd");if(e2)e2.innerHTML=I("clock",16)+" "+t("boost_cd",ft((s.bc-n)/1000));var e3=$("rwc");if(e3)e3.innerHTML=I("clock",16)+" "+t("r_wait",ft((s.sp-n)/1000))}
function draw(){chk();var cxo=s.cx>Date.now();bump("co",s.co);bump("pt",s.pt);var h="";
 if(lr!==rent()){lr=rent();buildWheel()}
 P.forEach(function(q,p){var lk=s.tot<q.u,b;
  if(lk)b="<div class='mu' style='margin-top:6px'>"+I("lock",14)+" "+t("locked",fmt(q.u))+"</div><div class='bar'><i style='width:"+Math.min(100,s.tot/q.u*100)+"%;background:"+q.k+"'></i></div>";
  else b="<div class='chips'><span>"+I("box",13)+" "+t("toproc")+" <b>"+s.cr[p]+"</b></span><span>"+I("check",13)+" "+t("ready")+" <b>"+s.rd[p]+"</b></span></div>"+qsel(p)+"<div class='row btns'><button class='"+(cxo?"bad":"")+"' onclick='crear("+p+")'>"+t("make",fmt(cost(p)))+"</button><button class='"+(s.cr[p]?"":"dim")+"' onclick='procesar("+p+")'>"+t("process")+"</button><button class='g "+(s.rd[p]?"":"dim")+"' onclick='vender("+p+")'>"+t("sell")+(s.rd[p]?" ("+qty(p)+")":"")+"</button></div>";
  h+="<div class='card' style='border-color:"+q.k+"55;box-shadow:0 12px 34px rgba(0,0,0,.3),0 0 28px "+q.k+"1a'><div class='row'><b>"+I("gem",18,"color:"+q.k)+" "+q.n+"</b><span class='mu' id='pr"+p+"'></span></div>"+b+"</div>"});
 $("ps").innerHTML=h;
 $("up").innerHTML="<div class='card'><b>"+I("zap",18,"color:#ffd45e")+" "+t("upg")+"</b><div class='row' style='margin-top:10px'><span class='lb'>"+I("factory",18)+" "+t("spaces",s.sl)+"</span><button class='y' "+(s.sl>=8?"disabled":"")+" onclick='mejora(\"sl\")'>"+(s.sl>=8?t("max"):fmt(ucost("sl")))+"</button></div><div class='row' style='margin-top:10px'><span class='lb'>"+I("shield",18)+" "+t("security",s.sg)+"</span><button class='y' "+(s.sg>=5?"disabled":"")+" onclick='mejora(\"sg\")'>"+(s.sg>=5?t("max"):fmt(ucost("sg")))+"</button></div><div class='mu' style='margin-top:8px'>"+t("upnote",s.raids)+"</div></div>";
 rT();rB();rW();rA();jobs();hud();save()}
function keys(){var n=Date.now();return [s.cx>n,s.bo>n,s.bc>n,n>=s.sp,5-s.dt.sa,s.sh,s.vu>n].join()}

/* ===== Arranque ===== */
setInterval(function(){var a=econ(1),b=done(),k=keys(),c=k!==pk;pk=k;if(chk())c=true;if(a||b||c)draw();else{jobs();hud();save()}},1000);
setInterval(function(){if(SRV&&!spinning)S("sync")},6000);
try{if(TG){TG.ready();TG.expand()}}catch(e){}
try{var sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;if(sp&&/^ref_\d+$/.test(sp)&&!SRV&&!s.ref&&sp.slice(4)!==uid()){s.ref=sp.slice(4);s.co+=100;setTimeout(function(){toast(t("welcome"))},600)}}catch(e){}
if(s.nx<Date.now())s.nx=Date.now()+45000;
$("wrot").style.transform="rotate("+s.wr+"deg)";
srvSync();applyIcons();pk=keys();econ(Math.min(3600,(Date.now()-s.t)/1000));done();applyLang();
if(!s.ms&&!s.ref)toast(t("tapm"));
</script></body></html>
